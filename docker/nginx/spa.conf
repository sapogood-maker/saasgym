# Configuração Nginx para servir um build Flutter Web (SPA) usando GoRouter.
# Qualquer rota desconhecida cai em index.html para o GoRouter assumir o roteamento client-side.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json application/wasm font/woff2;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html e o service worker são o ponto de entrada que decide se o
    # cliente (inclusive um PWA já instalado no celular) vai buscar uma
    # versão nova — sem isso, o navegador pode servir um index.html/SW
    # cacheado por horas/dias e o usuário nunca vê o deploy novo, mesmo
    # com o servidor já atualizado (docs/27, achado do MS4).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # main.dart.js, flutter.js e as fontes/ícones não trocam de nome entre builds,
    # então usamos um cache curto em vez de "immutable" para não travar deploys.
    location /assets/ {
        expires 1d;
        access_log off;
    }
}

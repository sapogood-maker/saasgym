name: saasgym

services:
  # Imagem fixada por digest para builds reproduzíveis — ver
  # docker/backend.Dockerfile para como atualizar deliberadamente.
  postgres:
    image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      CORS_ORIGINS: ${CORS_ORIGINS}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOADS_DIR: /app/uploads
      TRIAL_DURATION_DAYS: ${TRIAL_DURATION_DAYS:-14}
      PUBLIC_API_PREFIX: ${PUBLIC_API_PREFIX:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      # Persiste uploads (logos etc.) entre restarts/rebuilds do container —
      # sem isso, o provider local perderia todo arquivo a cada deploy.
      - uploads_data:/app/uploads

  admin_web:
    build:
      context: ..
      dockerfile: docker/admin_web.Dockerfile
      args:
        # URL que o NAVEGADOR do cliente usa — precisa ser alcançável de
        # fora do compose (nunca o nome de serviço "backend").
        API_BASE_URL: ${ADMIN_WEB_API_BASE_URL:-http://localhost:3000/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_WEB_PORT:-5000}:80"

  student_web:
    build:
      context: ..
      dockerfile: docker/student_web.Dockerfile
      args:
        # URL que o NAVEGADOR do cliente usa — precisa ser alcançável de
        # fora do compose (nunca o nome de serviço "backend").
        API_BASE_URL: ${STUDENT_WEB_API_BASE_URL:-http://localhost:3000/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${STUDENT_WEB_PORT:-5001}:80"

volumes:
  postgres_data:
  uploads_data:
